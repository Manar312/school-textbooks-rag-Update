# nginx = the only public door. HTTP only here; see the HTTPS block at the bottom (certbot) for production TLS.
worker_processes auto;
events { worker_connections 1024; }

http {
  # login brute-force brake: 5 requests/minute per IP (+ the app's own throttle behind it)
  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
  server_tokens off;
  client_max_body_size 300m;            # textbook PDFs

  upstream api { server api:8000; }

  server {
    listen 80;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location = /metrics { return 404; }   # metrics are for Prometheus inside the network only

    location = /auth/login {
      limit_req zone=login burst=5 nodelay;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Server-Sent Events (streamed answers): do not buffer, allow long-lived responses
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }
  }
}

# ---- HTTPS (recommended in production) ----
# 1) get a certificate:  certbot certonly --standalone -d school.example.com  (stop nginx during the first run)
# 2) copy fullchain.pem + privkey.pem into deploy/nginx/certs/
# 3) add, inside http { }:
#    server { listen 443 ssl; server_name school.example.com;
#             ssl_certificate /etc/nginx/certs/fullchain.pem; ssl_certificate_key /etc/nginx/certs/privkey.pem;
#             ...same locations as above... }
#    and turn the port-80 server into:  return 301 https://$host$request_uri;
